<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樱花代码雨 | 抖音顶配版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
        }
        #codeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #sakuraCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="codeCanvas"></canvas>
    <canvas id="sakuraCanvas"></canvas>

    <script>
        // 粉色代码雨（更细、更密、垂坠感更强，对标抖音）
        const codeCanvas = document.getElementById('codeCanvas');
        const codeCtx = codeCanvas.getContext('2d');
        codeCanvas.width = window.innerWidth;
        codeCanvas.height = window.innerHeight;

        const codeStr = "01<>/{}()[];:+-=*&%$#@ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const fontSize = 12;
        const col = codeCanvas.width / fontSize;
        const drops = [];
        for(let i=0; i<col; i++) drops[i] = Math.random()*(-200);

        function drawCodeRain(){
            codeCtx.fillStyle = 'rgba(0,0,0,0.04)';
            codeCtx.fillRect(0,0,codeCanvas.width,codeCanvas.height);
            codeCtx.fillStyle = '#ff3366';
            codeCtx.font = fontSize+'px monospace';
            for(let i=0; i<drops.length; i++){
                const text = codeStr[Math.floor(Math.random()*codeStr.length)];
                codeCtx.fillText(text, i*fontSize, drops[i]*fontSize);
                if(drops[i]*fontSize>codeCanvas.height && Math.random()>0.98) drops[i]=Math.random()*-200;
                drops[i] += 1.2;
            }
        }
        setInterval(drawCodeRain,25);

        // 超真实樱花飘落（大小、旋转、飘落轨迹、密度对标抖音）
        const sakuraCanvas = document.getElementById('sakuraCanvas');
        const sakuraCtx = sakuraCanvas.getContext('2d');
        sakuraCanvas.width = window.innerWidth;
        sakuraCanvas.height = window.innerHeight;

        class Sakura{
            constructor(){
                this.x = Math.random()*sakuraCanvas.width;
                this.y = -30;
                this.r = Math.random()*7+3;
                this.speedY = Math.random()*1.2+0.6;
                this.speedX = Math.random()*0.8-0.4;
                this.rotate = Math.random()*Math.PI*2;
                this.rotateSpeed = Math.random()*0.03-0.015;
                this.opacity = Math.random()*0.4+0.6;
            }
            update(){
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotate += this.rotateSpeed;
            }
            draw(){
                sakuraCtx.save();
                sakuraCtx.globalAlpha = this.opacity;
                sakuraCtx.translate(this.x,this.y);
                sakuraCtx.rotate(this.rotate);
                sakuraCtx.beginPath();
                sakuraCtx.fillStyle = '#ffd8e0';
                sakuraCtx.ellipse(0,0,this.r,this.r*0.55,0,0,Math.PI*2);
                sakuraCtx.fill();
                sakuraCtx.restore();
            }
        }

        const sakuraList = [];
        function createSakura(){
            sakuraList.push(new Sakura());
        }
        setInterval(createSakura,60);

        function animateSakura(){
            sakuraCtx.clearRect(0,0,sakuraCanvas.width,sakuraCanvas.height);
            for(let i=0; i<sakuraList.length; i++){
                sakuraList[i].update();
                sakuraList[i].draw();
                if(sakuraList[i].y>sakuraCanvas.height) sakuraList.splice(i,1);
            }
            requestAnimationFrame(animateSakura);
        }
        animateSakura();

        window.addEventListener('resize',()=>{
            codeCanvas.width = window.innerWidth;
            codeCanvas.height = window.innerHeight;
            sakuraCanvas.width = window.innerWidth;
            sakuraCanvas.height = window.innerHeight;
        })
    </script>
</body>
</html>
