<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樱花代码雨｜抖音原版渐变复刻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            width: 100vw;
            height: 100vh;
            /* 核心：顶部粉红渐变向下过渡黑色，完全匹配你截图效果 */
            background: linear-gradient(to bottom, #580020 0%, #200010 30%, #000000 60%);
        }
        /* 底层代码雨 */
        #codeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* 樱花+星光层 */
        #sakuraCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="codeCanvas"></canvas>
    <canvas id="sakuraCanvas"></canvas>

    <script>
        // ========== 1. 细长连续垂坠代码雨（抖音原版长线效果） ==========
        const codeCanvas = document.getElementById('codeCanvas');
        const codeCtx = codeCanvas.getContext('2d');
        codeCanvas.width = window.innerWidth;
        codeCanvas.height = window.innerHeight;

        const codeStr = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ<>/{}()[];:+-=*&%$#@";
        const fontSize = 10;
        const col = codeCanvas.width / fontSize;
        const drops = [];
        for (let i = 0; i < col; i++) drops[i] = Math.random() * -codeCanvas.height;

        function drawCodeRain() {
            // 超长拖尾，实现垂坠细线
            codeCtx.fillStyle = 'rgba(0, 0, 0, 0.045)';
            codeCtx.fillRect(0, 0, codeCanvas.width, codeCanvas.height);
            // 适配顶部渐变，上方代码偏亮粉、下方暗粉
            codeCtx.fillStyle = '#ff4070';
            codeCtx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = codeStr[Math.floor(Math.random() * codeStr.length)];
                codeCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > codeCanvas.height && Math.random() > 0.988) {
                    drops[i] = Math.random() * -codeCanvas.height;
                }
                drops[i] += 1.5;
            }
        }
        setInterval(drawCodeRain, 20);

        // ========== 2. 分层樱花+星光，匹配原图疏密 ==========
        const sakuraCanvas = document.getElementById('sakuraCanvas');
        const sakuraCtx = sakuraCanvas.getContext('2d');
        sakuraCanvas.width = window.innerWidth;
        sakuraCanvas.height = window.innerHeight;

        class Sakura {
            constructor() {
                this.x = Math.random() * sakuraCanvas.width;
                this.y = Math.random() * -80;
                this.r = Math.random() * 10 + 3;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = Math.random() * 1 - 0.5;
                this.rotate = Math.random() * Math.PI * 2;
                this.rotateSpeed = Math.random() * 0.04 - 0.02;
                this.opacity = Math.random() * 0.4 + 0.6;
                this.isStar = Math.random() > 0.82; // 星光小点
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotate += this.rotateSpeed;
            }
            draw() {
                sakuraCtx.save();
                sakuraCtx.globalAlpha = this.opacity;
                sakuraCtx.translate(this.x, this.y);
                sakuraCtx.rotate(this.rotate);

                if (this.isStar) {
                    sakuraCtx.fillStyle = '#ffd8e0';
                    sakuraCtx.beginPath();
                    sakuraCtx.arc(0, 0, this.r * 0.22, 0, Math.PI * 2);
                    sakuraCtx.fill();
                } else {
                    sakuraCtx.fillStyle = '#ffdde4';
                    sakuraCtx.beginPath();
                    sakuraCtx.ellipse(0, 0, this.r, this.r * 0.5, 0, 0, Math.PI * 2);
                    sakuraCtx.fill();
                }
                sakuraCtx.restore();
            }
        }

        const sakuraList = [];
        function createSakura() {
            sakuraList.push(new Sakura());
        }
        setInterval(createSakura, 40);

        function animateSakura() {
            sakuraCtx.clearRect(0, 0, sakuraCanvas.width, sakuraCanvas.height);
            for (let i = 0; i < sakuraList.length; i++) {
                sakuraList[i].update();
                sakuraList[i].draw();
                if (sakuraList[i].y > sakuraCanvas.height) sakuraList.splice(i, 1);
            }
            requestAnimationFrame(animateSakura);
        }
        animateSakura();

        // 窗口自适应
        window.addEventListener('resize', () => {
            codeCanvas.width = window.innerWidth;
            codeCanvas.height = window.innerHeight;
            sakuraCanvas.width = window.innerWidth;
            sakuraCanvas.height = window.innerHeight;
        })
    </script>
</body>
</html>
