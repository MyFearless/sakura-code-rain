<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樱花代码雨｜抖音原版复刻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            background: #000000;
            width: 100vw;
            height: 100vh;
        }
        /* 底层代码雨 */
        #codeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* 樱花+星光层 */
        #sakuraCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="codeCanvas"></canvas>
    <canvas id="sakuraCanvas"></canvas>

    <script>
        // ========== 1. 垂直细线条代码雨（和抖音完全一致） ==========
        const codeCanvas = document.getElementById('codeCanvas');
        const codeCtx = codeCanvas.getContext('2d');
        codeCanvas.width = window.innerWidth;
        codeCanvas.height = window.innerHeight;

        // 字符集和抖音完全匹配
        const codeStr = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ<>/{}()[];:+-=*&%$#@";
        const fontSize = 11;
        const col = codeCanvas.width / fontSize;
        const drops = [];
        // 初始随机顶部下落
        for (let i = 0; i < col; i++) drops[i] = Math.random() * -codeCanvas.height;

        function drawCodeRain() {
            // 拖尾效果，做出垂坠长线
            codeCtx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            codeCtx.fillRect(0, 0, codeCanvas.width, codeCanvas.height);
            // 深粉色，和抖音色调一致
            codeCtx.fillStyle = '#ff2a5a';
            codeCtx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = codeStr[Math.floor(Math.random() * codeStr.length)];
                codeCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                // 循环下落
                if (drops[i] * fontSize > codeCanvas.height && Math.random() > 0.985) {
                    drops[i] = Math.random() * -codeCanvas.height;
                }
                drops[i] += 1.4;
            }
        }
        setInterval(drawCodeRain, 22);

        // ========== 2. 大片樱花+细碎星光（1:1复刻原图） ==========
        const sakuraCanvas = document.getElementById('sakuraCanvas');
        const sakuraCtx = sakuraCanvas.getContext('2d');
        sakuraCanvas.width = window.innerWidth;
        sakuraCanvas.height = window.innerHeight;

        class Sakura {
            constructor() {
                this.x = Math.random() * sakuraCanvas.width;
                this.y = -40;
                // 花瓣大小分层，和原图一致
                this.r = Math.random() * 9 + 4;
                this.speedY = Math.random() * 1.4 + 0.7;
                this.speedX = Math.random() * 0.9 - 0.45;
                this.rotate = Math.random() * Math.PI * 2;
                this.rotateSpeed = Math.random() * 0.035 - 0.018;
                this.opacity = Math.random() * 0.35 + 0.65;
                // 区分花瓣/星光小点
                this.isStar = Math.random() > 0.85;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotate += this.rotateSpeed;
            }
            draw() {
                sakuraCtx.save();
                sakuraCtx.globalAlpha = this.opacity;
                sakuraCtx.translate(this.x, this.y);
                sakuraCtx.rotate(this.rotate);

                if (this.isStar) {
                    // 细碎星光小点
                    sakuraCtx.fillStyle = '#ffd6dd';
                    sakuraCtx.beginPath();
                    sakuraCtx.arc(0, 0, this.r * 0.25, 0, Math.PI * 2);
                    sakuraCtx.fill();
                } else {
                    // 椭圆花瓣，柔和真实
                    sakuraCtx.fillStyle = '#ffdde3';
                    sakuraCtx.beginPath();
                    sakuraCtx.ellipse(0, 0, this.r, this.r * 0.52, 0, 0, Math.PI * 2);
                    sakuraCtx.fill();
                }
                sakuraCtx.restore();
            }
        }

        const sakuraList = [];
        // 密度拉高，和原图花瓣量一致
        function createSakura() {
            sakuraList.push(new Sakura());
        }
        setInterval(createSakura, 45);

        function animateSakura() {
            sakuraCtx.clearRect(0, 0, sakuraCanvas.width, sakuraCanvas.height);
            for (let i = 0; i < sakuraList.length; i++) {
                sakuraList[i].update();
                sakuraList[i].draw();
                if (sakuraList[i].y > sakuraCanvas.height) sakuraList.splice(i, 1);
            }
            requestAnimationFrame(animateSakura);
        }
        animateSakura();

        // 窗口自适应
        window.addEventListener('resize', () => {
            codeCanvas.width = window.innerWidth;
            codeCanvas.height = window.innerHeight;
            sakuraCanvas.width = window.innerWidth;
            sakuraCanvas.height = window.innerHeight;
        })
    </script>
</body>
</html>
